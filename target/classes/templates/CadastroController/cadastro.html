<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Kemilly Music</title>
    <link rel="stylesheet" href="/css/geral.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body onload="verificarSeJaEstaLogado();">

<div class="container">
    <div class="box">
        <h2><i class="fa-solid fa-music"></i> Kemilly Music</h2>
        <h3>Criar conta</h3>

        <form id="formCadastro" onsubmit="cadastrar(event)">
            <input type="text" id="nome" placeholder="Nome" required>
            <input type="email" id="emailCadastro" placeholder="Email" required>
            <input type="password" id="senhaCadastro" placeholder="Senha" required>
            <button type="submit">Cadastrar</button>
        </form>

        <p>
            Já tem conta?<br>
            <a href="/login">Entrar</a>
        </p>
    </div>
</div>

<script src="/js/login.js"></script>
<script src="/js/cadastro.js"></script>
</body>
</html>
