<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Buscar - Kemilly Music</title>
    <link rel="stylesheet" href="/css/geral.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body onload="verificarLogin(); mostrarUsuario(); mostrarMenuAdmin(); propagarSessaoNosLinks();">

<div class="menu">
    <h2><i class="fa-solid fa-star"></i> Kemilly Music</h2>
    <ul>
        <li id="menuAdmin" style="display:none;"><a href="/admin"><i class="fa-solid fa-shield"></i> Admin</a></li>
        <li><a href="/perfil"><i class="fa-solid fa-user"></i> Perfil</a></li>
        <li><a href="/home"><i class="fa-solid fa-house"></i> Início</a></li>
        <li class="ativo"><a href="/buscar"><i class="fa-solid fa-magnifying-glass"></i> Buscar</a></li>
        <li><a href="/biblioteca"><i class="fa-solid fa-layer-group"></i> Biblioteca</a></li>
    </ul>
</div>

<div class="conteudo">

    <div class="topo">
        <h2><i class="fa-solid fa-magnifying-glass"></i> Buscar músicas</h2>
        <p id="nomeUsuario"></p>
    </div>

    <div class="secao">
        <input type="text" id="campoBusca" placeholder="Digite o nome da música...">
        <button onclick="buscarMusica()">Buscar</button>
    </div>

    <div class="secao">
        <h3>Resultados:</h3>
        <div id="resultados"></div>
    </div>

</div>

<script src="/js/login.js"></script>
<script src="/js/buscar.js"></script>
</body>
</html>
