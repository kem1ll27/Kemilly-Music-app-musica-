# ===== Banco de dados: MySQL do Laragon =====

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/kemilly_music?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo

# ===== Hibernate =====
# drop-and-create: toda vez que o Quarkus sobe, apaga e recria as tabelas + roda import.sql
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# ===== HTTP =====
quarkus.http.port=8080
